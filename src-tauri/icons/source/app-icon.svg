<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs>
  <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#30262a"/><stop offset="0.55" stop-color="#1b1517"/><stop offset="1" stop-color="#0d0a0b"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5"><stop offset="0" stop-color="#b6a0a0" stop-opacity="0.18"/><stop offset="1" stop-color="#b6a0a0" stop-opacity="0"/></radialGradient>
  <linearGradient id="mk" x1="0.25" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#f4eded"/><stop offset="0.6" stop-color="#cdb8b8"/><stop offset="1" stop-color="#9c8384"/></linearGradient>
  <linearGradient id="mk2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a7072"/><stop offset="1" stop-color="#f4eded"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
