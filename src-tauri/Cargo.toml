[package]
name = "freshet"
version = "0.1.0"
description = "Menu bar app for keeping macOS dev tools and apps up to date"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
