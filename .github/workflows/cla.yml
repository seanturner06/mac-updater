name: CLA

# CLA Assistant Lite — runs as a GitHub Action, no third-party service.
# Signature records live in this repository (the `cla-signatures` branch), so they remain
# under our control and survive any external service going away.
#
# On each PR the action checks whether every commit author has signed. If not, it comments
# asking them to, and sets a failing status check. Contributors sign by replying to that
# comment with the exact phrase below.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

# pull_request_target is required so the check also works for PRs from forks. It runs against
# the BASE repo's workflow definition and never checks out the PR's code, so untrusted code is
# not executed with these permissions.
permissions:
  actions: write
  contents: write          # writes the signature file to the signatures branch
  pull-requests: write     # posts and updates the signing comment
  statuses: write          # sets the CLA status check

concurrency:
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # Only act on the signing phrase, or on real PR events — not on every comment in the repo.
    if: >
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where signatures are recorded. Keep this path stable — changing it invalidates
          # every existing signature.
          path-to-signatures: 'signatures/v1/cla.json'
          branch: 'cla-signatures'

          # Pin to a COMMIT, not to `main`. A signature has to reference the exact text that
          # was agreed to; a moving link means nobody can prove what they signed.
          # Replace <COMMIT-SHA> after committing CLA.md — see .github/workflows/README-cla.md
          path-to-document: 'https://github.com/seanturner06/mac-updater/blob/<COMMIT-SHA>/.github/CLA.md'

          # People who never need to sign: the copyright holder, and bots.
          allowlist: 'seanturner06,dependabot[bot],github-actions[bot],renovate[bot]'

          custom-notsigned-prcomment: >
            Thanks for the pull request — before it can be merged, please sign the
            [Contributor License Agreement](https://github.com/seanturner06/mac-updater/blob/main/.github/CLA.md).

            You keep the copyright in your work and can reuse it however you like. Your
            contribution will always remain available under AGPL-3.0. The agreement
            additionally lets the project be offered under commercial terms, which is what
            funds its development — the reasoning is explained at the bottom of the CLA.

            To sign, reply to this thread with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
          lock-pullrequest-aftermerge: false
