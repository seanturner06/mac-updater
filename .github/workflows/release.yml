name: Release

# Push a tag like v0.2.0 to build a signed, notarized, stapled Freshet as a draft GitHub release.
# Setup (Apple Developer account, certificate, secrets): docs/14-release-signing.md.
on:
  push:
    # Version tags only — not the `v<version>-unsigned` tags test-release.yml's drafts get when
    # they're published (publishing a draft creates its tag as *you*, which does trigger workflows).
    tags: ["v*", "!v*-unsigned"]
  workflow_dispatch:

permissions:
  contents: write # create the draft release

jobs:
  macos:
    name: Build, sign, notarize
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain (both Mac architectures)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse to build without signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Signing secrets are not configured; see docs/14-release-signing.md"
            exit 1
          fi

      # tauri-action imports the certificate into a temporary keychain, signs with the hardened
      # runtime, submits to Apple's notary service, waits, and staples the ticket.
      - name: Build, sign and notarize
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Signs the self-update archive; the app only installs updates that verify against the
          # public key in tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          # Updater artifacts (signed .app.tar.gz + latest.json) only in CI, where the key exists;
          # local `tauri build`s stay key-free.
          args: '--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":true}}'
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: Freshet ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # Don't trust the build step's word for it: verify the artifact the way a user's Mac will.
      - name: Verify signature, notarization and stapled ticket
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime Version)='
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
